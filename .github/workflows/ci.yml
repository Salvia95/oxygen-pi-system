# 모든 push · PR 의 시험 (docs/skill-combo-spec.md §4, C1): 위생 · 진행판, 단위, E2E(mock LLM), 화면 프로그램(Rust).
# 비밀과 비용이 없다 (실제 LLM 은 skill-eval.yml). 저장소에는 바이너리가 없으므로 fetch-bundle 로 공식 배포처에서 받아 sha256 을 확인한다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # 액션은 커밋 SHA 로 고정한다
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          fetch-depth: 0   # 진행판 검사가 기록된 커밋이 있는지 본다

      - name: 내려받은 구성요소 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .cache/downloads
          key: bundle-${{ runner.os }}-${{ hashFiles('manifest/**') }}

      # 필수(node · pi · fd · rg · jq) + 시험에 쓰는 것. 브라우저 · SQLcl 은 받지 않는다
      - name: 구성요소 받기
        run: bash scripts/fetch-bundle.sh --select=just,hurl,usql,ast-grep,psmux

      - name: 위생 · 진행판
        run: source ./env.sh && ./bin/just.exe hygiene

      - name: 단위
        run: source ./env.sh && ./bin/just.exe unit

      - name: E2E (mock LLM)
        run: source ./env.sh && ./bin/just.exe e2e

      - name: 화면 프로그램 (Rust)
        working-directory: installer/oxy-tui
        run: cargo test --release --locked
