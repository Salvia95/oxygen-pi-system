[package]
name = "oxy-tui"
version = "0.3.0"
edition = "2024"
description = "oxygen-pi-system 설치·설정 TUI 의 화면. 그리기와 키 입력만 맡고, 무엇을 보일지는 installer/*.mjs 가 파이프로 지시한다"
publish = false

[dependencies]
# 기본 기능(달력 위젯 · 매크로 · 레이아웃 캐시)은 쓰지 않는다
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
